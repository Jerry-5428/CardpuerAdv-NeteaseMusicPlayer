; Cardputer-Adv NetEase Music Player
; Target: M5Stack Cardputer-Adv (Stamp-S3A / ESP32-S3FN8, 8MB Flash, NO PSRAM)
;
; Verified against M5Stack official documentation:
;   https://docs.m5stack.com/en/core/Cardputer-Adv
;   https://docs.m5stack.com/en/arduino/m5cardputer/program
;
; NOTE: PSRAM must NOT be enabled. Cardputer-Adv has no PSRAM.

[env:m5stack-cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200

board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_LOOP_STACK_SIZE=8192
    -DCONFIG_ARDUHAL_LOG_COLORS=0

; All third-party libraries (M5Cardputer, M5Unified, M5GFX, ArduinoJson,
; ESP8266Audio, QRCode) are vendored under lib/ so the project builds offline
; and is fully reproducible.  Keep lib_deps empty; do not install a second
; copy from the registry.
lib_deps =

build_unflags =
    -fno-rtti

build_type = release
